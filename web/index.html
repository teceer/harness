<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>harness</title>
<style>
  :root{
    --bg:#1a1b26; --card:#20222f; --line:#3a4160; --text:#e6e9f2; --sub:#a3adc8;
    --muted:#7c849c; --accent:#7aa2ff; --working:#ffb547; --waiting:#ff5c8a;
    --idle:#5ee38f; --stopped:#7c849c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:12px 16px;z-index:10}
  header h1{font-size:16px;margin:0;font-weight:700;color:var(--accent);flex:1}
  button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:9px 14px;min-height:40px}
  button:active{background:#2a3350}
  button.primary{background:var(--accent);border-color:var(--accent);color:#10131c;font-weight:600}
  main{padding:8px 12px 24px;max-width:760px;margin:0 auto}
  .section{color:var(--sub);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    margin:18px 6px 8px;font-weight:700}
  .row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
  .row .dot{font-size:13px;line-height:1.4}
  .row .grow{flex:1;min-width:0}
  .row .title{display:flex;gap:8px;align-items:baseline}
  .row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .age{color:var(--sub);font-size:12px;margin-left:auto;white-space:nowrap}
  .row .meta{color:var(--muted);font-size:12px;margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .num{color:var(--muted);font-size:12px;min-width:14px}
  .working{color:var(--working)} .waiting{color:var(--waiting)} .idle{color:var(--idle)}
  .archived,.ended,.starting{color:var(--stopped)}
  .pill{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
  dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;
    width:min(760px,96vw);max-height:92vh;padding:0}
  dialog::backdrop{background:#000a}
  .sheet{display:flex;flex-direction:column;max-height:92vh}
  .sheet header{border-radius:16px 16px 0 0}
  .msgs{overflow-y:auto;padding:12px 16px;flex:1;-webkit-overflow-scrolling:touch}
  .msg{margin-bottom:14px;white-space:pre-wrap;word-break:break-word}
  .who{font-size:12px;font-weight:700;margin-bottom:2px}
  .who.you{color:var(--accent)} .who.claude{color:#c792ea}
  .msg .body{color:var(--sub)}
  .msg.you .body{color:var(--text)}
  footer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .keys{display:flex;gap:6px;flex-wrap:wrap}
  .keys button{padding:6px 10px;min-height:34px;font-size:13px}
  textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:10px;font:inherit;resize:none;min-height:44px}
  .send{display:flex;gap:8px;align-items:flex-end}
  .note{color:var(--muted);font-size:12px;padding:0 4px}
  .err{color:var(--waiting);font-size:13px;padding:8px 4px}
  input[type=text]{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:10px;font:inherit}
</style>
</head>
<body>
<header>
  <h1>harness</h1>
  <span id="conn" class="pill">…</span>
  <button id="newBtn">+ new</button>
</header>
<main id="list"><p class="note">connecting…</p></main>

<dialog id="detail"><div class="sheet">
  <header>
    <h1 id="dTitle">session</h1>
    <span id="dStatus" class="pill"></span>
    <button id="dClose">close</button>
  </header>
  <div class="msgs" id="dMsgs"></div>
  <footer>
    <div class="keys" id="dKeys"></div>
    <div class="send">
      <textarea id="dText" rows="1" placeholder="reply to this session…"></textarea>
      <button class="primary" id="dSend">send</button>
    </div>
    <div class="note" id="dNote"></div>
  </footer>
</div></dialog>

<dialog id="newDlg"><div class="sheet">
  <header><h1>new session</h1><button id="nClose">close</button></header>
  <div class="msgs">
    <input type="text" id="nDir" list="dirs" placeholder="~/code/project" autocapitalize="off" autocorrect="off" spellcheck="false">
    <datalist id="dirs"></datalist>
    <p class="note">the profile (and Claude account) follows the directory</p>
  </div>
  <footer><button class="primary" id="nStart">start</button></footer>
</div></dialog>

<script>
const token = new URLSearchParams(location.search).get('t') || localStorage.getItem('harness-token') || '';
if (token) localStorage.setItem('harness-token', token);
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const glyph = {working:'●', waiting:'◆', idle:'○', starting:'◌', archived:'▪', ended:'·'};
let state = {sessions:[], dirs:[]}, openId = null;

async function api(path, opts = {}) {
  const res = await fetch(path, {...opts, headers:{...(opts.headers||{}), 'Authorization':'Bearer '+token,
    'Content-Type':'application/json'}});
  if (!res.ok) throw new Error((await res.text()).trim() || res.statusText);
  return res.status === 204 ? null : res.json();
}

function render() {
  const groups = {};
  for (const s of state.sessions) (groups[s.section] ||= []).push(s);
  const order = ['active', 'outside harness', 'archived', 'ended'];
  let html = '';
  for (const name of order) {
    const rows = groups[name];
    if (!rows?.length) continue;
    html += `<div class="section">${esc(name)} · ${rows.length}</div>`;
    for (const s of rows) html += row(s);
  }
  $('list').innerHTML = html || '<p class="note">no sessions yet</p>';
  $('dirs').innerHTML = state.dirs.map(d => `<option value="${esc(d)}">`).join('');
  for (const el of document.querySelectorAll('[data-id]')) el.onclick = () => open(el.dataset.id);
  if (openId) paintDetail();
}

function row(s) {
  const detail = s.status === 'working' && s.detail ? ` <span class="pill">${esc(s.detail)}</span>` : '';
  return `<button class="row" data-id="${esc(s.id)}">
    <span class="num">${s.number || ''}</span>
    <span class="dot ${s.status}">${glyph[s.status] || '·'}</span>
    <span class="grow">
      <span class="title"><span class="name">${s.shown ? '▌' : ''}${esc(s.label)}</span>${detail}
        <span class="age">${esc(s.age)}</span></span>
      <span class="meta">${esc(s.dir)}${s.snippet ? ' · ' + esc(s.snippet) : ''}</span>
    </span></button>`;
}

function session(id) { return state.sessions.find(s => s.id === id); }

async function open(id) {
  openId = id;
  $('detail').showModal();
  paintDetail();
  await loadMessages(id);
}

function paintDetail() {
  const s = session(openId);
  if (!s) return;
  $('dTitle').textContent = s.label;
  $('dStatus').textContent = s.status + (s.detail && s.status === 'working' ? ' · ' + s.detail : '');
  $('dStatus').className = 'pill ' + s.status;
  const keys = s.status === 'waiting' ? ['Enter', '1', '2', 'Escape'] : ['Enter', 'Escape'];
  $('dKeys').innerHTML = s.running ? keys.map(k => `<button data-key="${k}">${k}</button>`).join('') +
      `<button data-act="archive">archive</button>` :
    (s.resumable ? `<button data-act="resume" class="primary">resume</button>` : '');
  for (const b of $('dKeys').querySelectorAll('[data-key]')) b.onclick = () => act('send', {key:b.dataset.key});
  for (const b of $('dKeys').querySelectorAll('[data-act]')) b.onclick = () => act(b.dataset.act);
  $('dText').disabled = !s.running;
  $('dSend').disabled = !s.running;
  $('dNote').textContent = s.running ? s.dir : (s.resumable ? 'stopped — resume to answer' : s.dir);
}

async function loadMessages(id) {
  $('dMsgs').innerHTML = '<p class="note">loading…</p>';
  try {
    const d = await api(`/api/sessions/${encodeURIComponent(id)}/messages`);
    $('dMsgs').innerHTML = (d.messages || []).map(m => `<div class="msg ${m.Role === 'user' ? 'you' : ''}">
        <div class="who ${m.Role === 'user' ? 'you' : 'claude'}">${m.Role === 'user' ? 'you' : 'claude'}</div>
        <div class="body">${esc(m.Text)}</div></div>`).join('') || '<p class="note">no messages yet</p>';
    $('dMsgs').scrollTop = $('dMsgs').scrollHeight;
  } catch (e) { $('dMsgs').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function act(what, body, force) {
  const id = openId;
  const q = force ? '?force=1' : '';
  try {
    if (what === 'send') await api(`/api/sessions/${encodeURIComponent(id)}/send`, {method:'POST', body:JSON.stringify(body)});
    else await api(`/api/sessions/${encodeURIComponent(id)}/${what}${q}`, {method:'POST'});
    if (what === 'send') setTimeout(() => loadMessages(id), 1200);
  } catch (e) {
    // archiving a busy session needs a second yes, as it does in the sidebar
    if (what === 'archive' && !force && confirm(e.message + '\n\nArchive anyway?')) return act(what, body, true);
    $('dNote').innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

$('dSend').onclick = async () => {
  const text = $('dText').value.trim();
  if (!text) return;
  $('dText').value = '';
  await act('send', {text});
};
$('dText').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; });
$('dClose').onclick = () => { $('detail').close(); openId = null; };
$('newBtn').onclick = () => { $('nDir').value = state.dirs[0] || '~/'; $('newDlg').showModal(); };
$('nClose').onclick = () => $('newDlg').close();
$('nStart').onclick = async () => {
  try {
    await api('/api/new', {method:'POST', body:JSON.stringify({dir:$('nDir').value.trim()})});
    $('newDlg').close();
  } catch (e) { alert(e.message); }
};

function connect() {
  const es = new EventSource('/api/events?t=' + encodeURIComponent(token));
  es.onmessage = e => { state = JSON.parse(e.data); $('conn').textContent = 'live'; render(); };
  es.onerror = () => { $('conn').textContent = 'reconnecting'; es.close(); setTimeout(connect, 2000); };
}
api('/api/state').then(s => { state = s; render(); connect(); })
  .catch(e => { $('list').innerHTML = `<p class="err">${esc(e.message)} — open the link from the notification (it carries the token)</p>`; });
if (location.hash.length > 1) setTimeout(() => open(decodeURIComponent(location.hash.slice(1))), 400);
</script>
</body>
</html>
