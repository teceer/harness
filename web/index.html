<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>harness</title>
<style>
  :root{
    --bg:#1a1b26; --card:#20222f; --line:#3a4160; --text:#e6e9f2; --sub:#a3adc8;
    --muted:#7c849c; --accent:#7aa2ff; --working:#ffb547; --waiting:#ff5c8a;
    --idle:#5ee38f; --stopped:#7c849c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:10px 14px;z-index:10}
  header h1{font-size:16px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  header h1.home{color:var(--accent)}
  button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:9px 14px;min-height:40px}
  button:active{background:#2a3350}
  button.primary{background:var(--accent);border-color:var(--accent);color:#10131c;font-weight:600}
  button.icon{padding:8px 13px;font-size:17px;line-height:1}
  .view{flex:1;min-height:0;display:none;flex-direction:column}
  .view.on{display:flex}
  #list{overflow-y:auto;padding:8px 12px 24px}
  .inner{max-width:760px;margin:0 auto;width:100%}
  .section{color:var(--sub);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    margin:18px 6px 8px;font-weight:700}
  .profile{font-size:12px;font-weight:700;margin:10px 6px 6px}
  .filters{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;-webkit-overflow-scrolling:touch}
  .filters button{padding:5px 11px;min-height:32px;font-size:13px;border-radius:999px;white-space:nowrap}
  .filters button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
  .row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
  .row .grow{flex:1;min-width:0}
  .row .title{display:flex;gap:8px;align-items:baseline}
  .row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .age{color:var(--sub);font-size:12px;margin-left:auto;white-space:nowrap}
  .row .meta{color:var(--muted);font-size:12px;margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .num{color:var(--muted);font-size:12px;min-width:14px}
  .working{color:var(--working)} .waiting{color:var(--waiting)} .idle{color:var(--idle)}
  .archived,.ended,.starting{color:var(--stopped)}
  .pill{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;
    padding:1px 7px;white-space:nowrap}
  .tabs{display:flex;gap:6px;padding:8px 12px 0;justify-content:center}
  .tabs button{padding:5px 14px;min-height:32px;font-size:13px;border-radius:999px}
  .tabs button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
  .msgs{overflow-y:auto;padding:12px 16px;flex:1;-webkit-overflow-scrolling:touch}
  .shot{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:6px;display:block}
  #pane{flex:1;overflow:auto;margin:0;padding:10px 12px;background:#12131c;
    font:11px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;
    -webkit-overflow-scrolling:touch;color:var(--text)}
  .msg{margin-top:10px;word-break:break-word;line-height:1.4}
  .msg.cont{margin-top:4px}
  .inner>.msg:first-child{margin-top:0}
  .who{font-size:12px;font-weight:700;margin-bottom:1px}
  .who.you{color:var(--accent)} .who.claude{color:#c792ea}
  .msg .body{color:var(--sub);white-space:pre-wrap}
  .msg .md{white-space:normal}
  .md>:first-child{margin-top:0} .md>:last-child{margin-bottom:0}
  .md p,.md ul,.md ol,.md pre,.md blockquote,.md table{margin:0 0 5px}
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{color:var(--text);margin:8px 0 3px;line-height:1.3}
  .md h1{font-size:18px} .md h2{font-size:17px} .md h3{font-size:16px}
  .md h4,.md h5,.md h6{font-size:15px}
  .md strong{color:var(--text)}
  .md ul,.md ol{padding-left:20px} .md li{margin:1px 0} .md li>ul,.md li>ol{margin:1px 0}
  .md a{color:var(--accent)}
  .md code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card);
    border:1px solid var(--line);border-radius:5px;padding:0 4px}
  .md pre{background:#12131c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:pre}
  .md pre code{background:none;border:0;padding:0;font-size:12px}
  .md blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--muted)}
  .md hr{border:0;border-top:1px solid var(--line);margin:6px 0}
  .md .table{overflow-x:auto;margin:0 0 5px}
  .md table{border-collapse:collapse;font-size:13px}
  .md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
  .md th{color:var(--text);background:var(--card)}
  .msg.you .body{color:var(--text)}
  footer{border-top:1px solid var(--line);padding:10px 12px}
  footer .inner{display:flex;flex-direction:column;gap:8px}
  .keys{display:flex;gap:6px;flex-wrap:wrap}
  .keys button{padding:6px 10px;min-height:34px;font-size:13px}
  textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:10px;font:inherit;font-size:16px;resize:none;min-height:44px;max-height:40vh}
  .send{display:flex;gap:8px;align-items:flex-end}
  .note{color:var(--muted);font-size:12px;padding:0 4px}
  .err{color:var(--waiting);font-size:13px;padding:8px 4px}
  dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;
    width:min(760px,96vw);padding:16px}
  dialog::backdrop{background:#000a}
  input[type=text]{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:10px;font:inherit;font-size:16px;margin:10px 0}
</style>
</head>
<body>
<header>
  <button id="back" class="icon" hidden>‹</button>
  <h1 id="title" class="home">harness</h1>
  <span id="conn" class="pill">…</span>
  <span id="profile" class="pill" hidden></span>
  <span id="status" class="pill" hidden></span>
  <button id="newBtn" class="icon">+</button>
</header>

<main id="list" class="view on"><div class="inner">
  <div class="filters" id="filters"></div>
  <div id="rows"><p class="note">connecting…</p></div>
</div></main>

<section id="session" class="view">
  <div class="tabs">
    <button id="tabChat" aria-pressed="true">conversation</button>
    <button id="tabLive" aria-pressed="false">live</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <pre id="pane" hidden></pre>
  <footer><div class="inner">
    <div class="keys" id="keys"></div>
    <div class="send">
      <button id="attach" class="icon" title="send a photo or screenshot">📎</button>
      <input type="file" id="file" accept="image/*" hidden>
      <textarea id="text" rows="1" placeholder="reply to this session…"></textarea>
      <button class="primary" id="send">send</button>
    </div>
    <div class="note" id="note"></div>
  </div></footer>
</section>

<dialog id="newDlg">
  <b>new session</b>
  <input type="text" id="nDir" list="dirs" placeholder="~/code/project" autocapitalize="off" autocorrect="off" spellcheck="false">
  <datalist id="dirs"></datalist>
  <div class="send"><button id="nClose">cancel</button><button class="primary" id="nStart">start</button></div>
</dialog>

<script>
const token = new URLSearchParams(location.search).get('t') || localStorage.getItem('harness-token') || '';
if (token) localStorage.setItem('harness-token', token);
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const glyph = {working:'●', waiting:'◆', idle:'○', starting:'◌', archived:'▪', ended:'·'};
let state = {sessions:[], dirs:[]};
let filter = localStorage.getItem('harness-profile') || '';
let live = false, chatES = null, paneES = null;

// Same stable colour per profile as the sidebar, so teceer/epc/networkrail
// look the same on the phone as on the Mac.
const profileColors = ['#7aa2ff','#ffb547','#c792ea','#4fd6be','#ff7eb6','#9ece6a'];
function profileColor(name) {
  if (!name || name === 'other') return 'var(--sub)';
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) | 0;
  return profileColors[Math.abs(h) % profileColors.length];
}

async function api(path, opts = {}) {
  const res = await fetch(path, {...opts, headers:{...(opts.headers||{}), 'Authorization':'Bearer '+token,
    'Content-Type':'application/json'}});
  if (!res.ok) throw Object.assign(new Error((await res.text()).trim() || res.statusText), {status: res.status});
  return res.status === 204 ? null : res.json();
}

// Routing: the list is /, a session is /s/<id>. Notification links open a
// session directly, and Back returns to the list.
const currentId = () => {
  const m = location.pathname.match(/^\/s\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
};
const go = path => { history.pushState({}, '', path + location.search); route(); };
const open = id => go('/s/' + encodeURIComponent(id));
addEventListener('popstate', route);
$('back').onclick = () => (history.length > 1 ? history.back() : go('/'));

function route() {
  const id = currentId();
  $('list').classList.toggle('on', !id);
  $('session').classList.toggle('on', !!id);
  $('back').hidden = !id;
  $('newBtn').hidden = !!id;
  $('status').hidden = $('profile').hidden = !id;
  $('title').classList.toggle('home', !id);
  if (!id) {
    closeStreams();
    $('title').textContent = 'harness';
    renderList();
    return;
  }
  paintSession();
  watchSession(id);
}

// One session: the conversation streams from the transcript, the live tab
// mirrors the tmux pane. Only the visible one is streamed.
function watchSession(id) {
  closeStreams();
  $('tabChat').setAttribute('aria-pressed', !live);
  $('tabLive').setAttribute('aria-pressed', live);
  $('msgs').hidden = live;
  $('pane').hidden = !live;
  if (!live) {
    $('msgs').innerHTML = '<div class="inner"><p class="note">loading…</p></div>';
    chatES = stream(id, 'stream', d => renderMessages(d.messages));
  } else {
    $('pane').textContent = 'connecting…';
    paneES = stream(id, 'pane', d => { $('pane').innerHTML = d.html; });
  }
}

function stream(id, what, onData) {
  const es = new EventSource(`/api/sessions/${encodeURIComponent(id)}/${what}?t=${encodeURIComponent(token)}`);
  es.onmessage = e => { if (currentId() === id) onData(JSON.parse(e.data)); };
  es.onerror = () => { if (what === 'pane') $('pane').textContent = 'not running in harness'; };
  return es;
}

function closeStreams() {
  chatES?.close(); paneES?.close();
  chatES = paneES = null;
}

$('tabChat').onclick = () => { live = false; watchSession(currentId()); };
$('tabLive').onclick = () => { live = true; watchSession(currentId()); };

// ---- list ----
function renderFilters() {
  const counts = {};
  for (const s of state.sessions) if (s.section !== 'ended') counts[s.profile] = (counts[s.profile] || 0) + 1;
  const names = Object.keys(counts).sort();
  if (filter && !counts[filter]) filter = ''; // that profile has nothing right now
  const chip = (value, text, color) =>
    `<button data-filter="${esc(value)}" aria-pressed="${filter === value}"
       ${color ? `style="color:${color}"` : ''}>${esc(text)}</button>`;
  $('filters').innerHTML = names.length < 2 ? '' :
    chip('', 'all') + names.map(n => chip(n, `${n} ${counts[n]}`, profileColor(n))).join('');
  for (const b of $('filters').querySelectorAll('[data-filter]')) b.onclick = () => {
    filter = b.dataset.filter;
    localStorage.setItem('harness-profile', filter);
    renderList();
  };
}

function renderList() {
  renderFilters();
  const shown = state.sessions.filter(s => !filter || s.profile === filter);
  const groups = {};
  for (const s of shown) (groups[s.section] ||= []).push(s);
  let html = '';
  for (const name of ['active', 'outside harness', 'archived', 'ended']) {
    const rows = groups[name];
    if (!rows?.length) continue;
    html += `<div class="section">${esc(name)} · ${rows.length}</div>`;
    let profile = null;
    for (const s of rows) {
      // one company at a time, as in the sidebar; with a filter on there is
      // only one profile left, so the subheader would be noise
      if (!filter && s.profile !== profile) {
        profile = s.profile;
        html += `<div class="profile" style="color:${profileColor(profile)}">${esc(profile)}</div>`;
      }
      html += row(s);
    }
  }
  $('rows').innerHTML = html || '<p class="note">nothing here</p>';
  $('dirs').innerHTML = state.dirs.map(d => `<option value="${esc(d)}">`).join('');
  for (const el of $('rows').querySelectorAll('[data-id]')) el.onclick = () => open(el.dataset.id);
}

function row(s) {
  const detail = s.status === 'working' && s.detail ? ` <span class="pill">${esc(s.detail)}</span>` : '';
  return `<button class="row" data-id="${esc(s.id)}">
    <span class="num">${s.number || ''}</span>
    <span class="${s.status}">${glyph[s.status] || '·'}</span>
    <span class="grow">
      <span class="title"><span class="name">${s.shown ? '▌' : ''}${esc(s.label)}</span>${detail}
        <span class="age">${esc(s.age)}</span></span>
      <span class="meta">${esc(s.dir)}${s.snippet ? ' · ' + esc(s.snippet) : ''}</span>
    </span></button>`;
}

// ---- one session ----
const session = () => state.sessions.find(s => s.id === currentId());

function paintSession() {
  const s = session();
  if (!s) { $('title').textContent = 'session'; return; }
  $('title').textContent = s.label;
  $('status').textContent = s.status + (s.detail && s.status === 'working' ? ' · ' + s.detail : '');
  $('status').className = 'pill ' + s.status;
  $('profile').textContent = s.profile;
  $('profile').style.color = profileColor(s.profile);
  $('profile').hidden = false;
  const keys = s.status === 'waiting' ? ['Enter', '1', '2', 'Escape'] : ['Enter', 'Escape'];
  $('keys').innerHTML = s.running
    ? keys.map(k => `<button data-key="${k}">${k}</button>`).join('') + '<button data-act="archive">archive</button>'
    : (s.resumable ? '<button data-act="resume" class="primary">resume</button>' : '');
  for (const b of $('keys').querySelectorAll('[data-key]')) b.onclick = () => act('send', {key:b.dataset.key});
  for (const b of $('keys').querySelectorAll('[data-act]')) b.onclick = () => act(b.dataset.act);
  $('text').disabled = $('send').disabled = !s.running;
  $('note').textContent = s.running ? s.dir : (s.resumable ? 'stopped — resume to answer' : s.dir);
}

// md renders Claude's markdown. Everything is escaped before any tag is
// added and links are http(s) only: the transcript carries tool output and
// web content, and this page holds a token that can type into sessions.
const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const fenceRe = /^\s*(```|~~~)/;
const ruleRe = /^\s*([-*_])(\s*\1){2,}\s*$/;
const sepRe = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
const blockStart = l => fenceRe.test(l) || /^#{1,6}\s/.test(l) || /^\s*>/.test(l) || listRe.test(l) || ruleRe.test(l);

function md(src) {
  const lines = (src || '').replace(/\r/g, '').split('\n'), out = [];
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    let m;
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(fenceRe))) {
      const code = [];
      for (i++; i < lines.length && !lines[i].trim().startsWith(m[1]); i++) code.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
    } else if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++;
    } else if (ruleRe.test(l)) {
      out.push('<hr>'); i++;
    } else if (/^\s*>/.test(l)) {
      const q = [];
      for (; i < lines.length && /^\s*>/.test(lines[i]); i++) q.push(lines[i].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${md(q.join('\n'))}</blockquote>`);
    } else if (l.includes('|') && sepRe.test(lines[i + 1] || '')) {
      const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => inline(c.trim()));
      const head = cells(l).map(c => `<th>${c}</th>`).join('');
      const rows = [];
      for (i += 2; i < lines.length && lines[i].includes('|') && lines[i].trim(); i++)
        rows.push('<tr>' + cells(lines[i]).map(c => `<td>${c}</td>`).join('') + '</tr>');
      out.push(`<div class="table"><table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`);
    } else if (listRe.test(l)) {
      const items = [];
      for (; i < lines.length; i++) {
        const t = lines[i];
        if ((m = t.match(listRe)) && items.length && m[1].length <= items[0].indent &&
            /\d/.test(m[2]) !== items[0].ordered) break; // a new list of the other kind
        if (m) items.push({indent: m[1].length, ordered: /\d/.test(m[2]), n: parseInt(m[2]), text: m[3]});
        else if (t.trim() && /^\s/.test(t) && !fenceRe.test(t)) items[items.length - 1].text += '\n' + t.trim();
        else if (!t.trim() && listRe.test(lines[i + 1] || '')) continue;
        else break;
      }
      out.push(mdList(items));
    } else {
      const para = [];
      for (; i < lines.length && lines[i].trim() && !(para.length && blockStart(lines[i])); i++) para.push(lines[i]);
      out.push(`<p>${para.map(inline).join('<br>')}</p>`);
    }
  }
  return out.join('');
}

function mdList(items) {
  let html = '';
  const stack = [];
  for (const it of items) {
    while (stack.length > 1 && it.indent < stack[stack.length - 1].indent) html += `</li></${stack.pop().tag}>`;
    const top = stack[stack.length - 1];
    if (!top || it.indent > top.indent) {
      const tag = it.ordered ? 'ol' : 'ul';
      stack.push({indent: it.indent, tag});
      html += it.ordered && it.n !== 1 ? `<ol start="${it.n}">` : `<${tag}>`;
    } else html += '</li>';
    const text = it.text.replace(/^\[([ xX])\]\s+/, (_, x) => x === ' ' ? '☐ ' : '☑ ');
    html += '<li>' + text.split('\n').map(inline).join('<br>');
  }
  while (stack.length) html += `</li></${stack.pop().tag}>`;
  return html;
}

function inline(s) {
  const keep = [];
  const hold = h => { keep.push(h); return `\u0000${keep.length - 1}\u0000`; };
  s = s.replace(/\u0000/g, '')
    .replace(/(`+)([^`]|[^`].*?[^`])\1(?!`)/g, (_, _t, c) => hold(`<code>${esc(c.trim())}</code>`))
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) =>
      hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${inline(t)}</a>`))
    .replace(/https?:\/\/[^\s<>"'`)\]]+[^\s<>"'`)\].,;:!?]/g, u =>
      hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`));
  s = esc(s)
    .replace(/\*\*(\S(?:.*?\S)??)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w])__(\S(?:.*?\S)??)__(?!\w)/g, '$1<strong>$2</strong>')
    .replace(/(^|[^*\w])\*([^\s*](?:.*?[^\s*])??)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/(^|[^\w])_(\S(?:.*?\S)??)_(?!\w)/g, '$1<em>$2</em>')
    .replace(/~~(\S(?:.*?\S)??)~~/g, '<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n]);
}

function renderMessages(msgs) {
  const atBottom = $('msgs').scrollTop + $('msgs').clientHeight > $('msgs').scrollHeight - 80;
  // Claude Code writes a turn as several blocks: a run from the same side
  // is labelled once and kept close together.
  let prev = '';
  const body = (msgs || []).map(m => {
    const who = m.Role === 'user' ? 'you' : 'claude';
    const pics = (m.Images || []).map(i =>
      `<img class="shot" src="data:${esc(i.MediaType)};base64,${esc(i.Data)}" alt="">`).join('');
    const label = who === prev ? '' : `<div class="who ${who}">${who}</div>`;
    const text = who === 'claude' ? md(m.Text) : esc((m.Text || '').trim());
    const cls = [who === 'you' ? 'you' : '', label ? '' : 'cont'].join(' ');
    prev = who;
    return `<div class="msg ${cls}">${label}<div class="body${who === 'claude' ? ' md' : ''}">${text}</div>${pics}</div>`;
  }).join('') || '<p class="note">no messages yet</p>';
  $('msgs').innerHTML = `<div class="inner">${body}</div>`;
  if (atBottom) $('msgs').scrollTop = $('msgs').scrollHeight;
}

async function act(what, body, force) {
  const id = currentId();
  try {
    if (what === 'send') await api(`/api/sessions/${encodeURIComponent(id)}/send`, {method:'POST', body:JSON.stringify(body)});
    else await api(`/api/sessions/${encodeURIComponent(id)}/${what}${force ? '?force=1' : ''}`, {method:'POST'});
  } catch (e) {
    // archiving a busy session needs a second yes, as it does in the sidebar
    if (what === 'archive' && !force && confirm(e.message + '\n\nArchive anyway?')) return act(what, body, true);
    $('note').innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

$('send').onclick = async () => {
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  $('text').style.height = 'auto';
  await act('send', {text});
};
$('attach').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0];
  if (!f) return;
  const form = new FormData();
  form.append('file', f);
  form.append('text', $('text').value.trim());
  $('text').value = '';
  $('note').textContent = 'sending ' + f.name + '…';
  try {
    const d = await fetch(`/api/sessions/${encodeURIComponent(currentId())}/upload`,
      {method:'POST', headers:{'Authorization':'Bearer '+token}, body:form});
    if (!d.ok) throw new Error((await d.text()).trim());
    $('note').textContent = 'sent — the session got the file path';
  } catch (e) { $('note').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  $('file').value = '';
};
$('text').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = e.target.scrollHeight + 'px';
});

// ---- new session ----
$('newBtn').onclick = () => { $('nDir').value = state.dirs[0] || '~/'; $('newDlg').showModal(); };
$('nClose').onclick = () => $('newDlg').close();
$('nStart').onclick = async () => {
  try {
    await api('/api/new', {method:'POST', body:JSON.stringify({dir:$('nDir').value.trim()})});
    $('newDlg').close();
  } catch (e) { alert(e.message); }
};

// ---- live state ----
function apply(s) {
  state = s;
  if (currentId()) paintSession(); else renderList();
}
function connect() {
  const es = new EventSource('/api/events?t=' + encodeURIComponent(token));
  es.onmessage = e => { $('conn').textContent = 'live'; apply(JSON.parse(e.data)); };
  es.onerror = () => { $('conn').textContent = 'offline'; es.close(); setTimeout(connect, 2000); };
}
// A home-screen app keeps its own storage, apart from Safari's, and opens
// without ?t=: ask for the token instead of leaving it locked out.
function askToken(message) {
  $('rows').innerHTML = `<p class="err">${esc(message)}</p>
    <p class="note">Open the link from a notification, or paste the token (~/.harness/web-token):</p>
    <input type="text" id="tok" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="token">
    <button class="primary" id="tokSave">save</button>`;
  $('tokSave').onclick = () => {
    const t = $('tok').value.trim();
    if (!t) return;
    localStorage.setItem('harness-token', t);
    location.replace(location.pathname + '?t=' + encodeURIComponent(t));
  };
}
if (!token) askToken('no token');
else api('/api/state').then(s => { apply(s); route(); connect(); })
  .catch(e => e.status === 401 ? askToken('the token was not accepted')
    : ($('rows').innerHTML = `<p class="err">${esc(e.message)}</p>`));
</script>
</body>
</html>
